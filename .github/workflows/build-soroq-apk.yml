name: Build So'roq 2D APK

on:
  push:
    paths:
      - 'AndroidAPK/**'
      - 'Interrogation2D/**'
      - '.github/workflows/build-soroq-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Copy current game into Android assets
        run: mkdir -p AndroidAPK/app/src/main/assets && cp Interrogation2D/index.html AndroidAPK/app/src/main/assets/index.html
      - name: Build debug APK
        working-directory: AndroidAPK
        run: gradle --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Soroq2D-debug-apk
          path: AndroidAPK/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
