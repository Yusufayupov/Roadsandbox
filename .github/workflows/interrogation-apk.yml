name: Build Interrogation 3D APK

on:
  push:
    paths:
      - 'interrogation-3d/**'
      - '.github/workflows/interrogation-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: interrogation-3d
        run: gradle --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Interrogation3D-debug-apk
          path: interrogation-3d/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
