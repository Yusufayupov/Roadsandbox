<!doctype html>
<html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#101317"><title>So‘roq — 04-xona</title>
<style>
:root{--gold:#d9bd8a;--glass:rgba(13,17,21,.86)}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101317;color:#f3eee7;font-family:Arial, sans-serif;touch-action:manipulation}
#game{position:relative;width:100vw;height:100dvh;overflow:hidden;background:#20282a;isolation:isolate}
#scene{position:absolute;inset:0;transition:filter .15s}#scene svg{width:100%;height:100%;display:block}
#top{position:absolute;top:env(safe-area-inset-top,8px);left:50%;transform:translateX(-50%);text-align:center;width:65%;padding:8px 4px;background:linear-gradient(90deg,transparent,#101317d9,transparent);pointer-events:none}
#top small{color:var(--gold);font-size:9px;letter-spacing:2.5px}#top strong{display:block;font-size:18px;letter-spacing:3px;margin:3px}
#counter{position:absolute;top:calc(env(safe-area-inset-top,8px) + 8px);left:10px;padding:8px 10px;background:#090d10b8;border-left:2px solid var(--gold);font-size:9px;letter-spacing:1px}#counter b{display:block;color:var(--gold);font-size:21px}
.panel{position:absolute;top:49%;transform:translateY(-50%);display:flex;flex-direction:column;gap:9px;width:clamp(72px,20vw,92px);padding:7px;background:var(--glass);border:1px solid #d4c09a44;border-radius:12px;backdrop-filter:blur(9px);box-shadow:0 8px 25px #0008}
#left{left:7px}#right{right:7px}.cap{text-align:center;color:#d4bd91;font-size:8px;letter-spacing:1px;margin-bottom:2px}
button{font:inherit;color:#f4eee7;border:1px solid #77654c;background:linear-gradient(#465057,#222c31);border-radius:8px;min-height:56px;padding:7px 3px;font-size:10px;font-weight:700;line-height:1.2;box-shadow:inset 0 1px #ffffff18,0 3px 9px #0006}
button:active{filter:brightness(1.4);transform:scale(.97)}button.warn{border-color:#96635a;background:linear-gradient(#70453f,#392725)}button.gold{border-color:#b79660;background:linear-gradient(#75603f,#403421)}button .sub{display:block;font-size:8px;font-weight:400;color:#c8bba8;margin-top:4px}
#bottom{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,8px) + 8px);width:calc(100% - 24px);max-width:480px;padding:12px 16px;text-align:center;background:#080c10e8;border:1px solid #ffffff24;border-radius:12px;backdrop-filter:blur(10px)}
#speaker{font-size:9px;letter-spacing:2px;color:var(--gold);margin-bottom:6px}#dialogue{font-size:14px;line-height:1.4;min-height:40px}
#reset{min-height:37px;margin-top:8px;width:100%;font-size:9px}
#hint{position:absolute;bottom:calc(env(safe-area-inset-bottom,8px) + 126px);left:50%;transform:translateX(-50%);font-size:9px;color:#e4d7c0;background:#101317a8;padding:5px 10px;border-radius:20px;white-space:nowrap}
#vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse,transparent 35%,#0009 100%)}
#flash{position:absolute;inset:0;background:#f7e8d4;opacity:0;pointer-events:none}
#impact{position:absolute;left:50%;bottom:-30%;width:46%;height:52%;transform:translateX(-50%);opacity:0;pointer-events:none}
#game.hit #impact{opacity:1;animation:arm .48s ease-out forwards}
@keyframes arm{0%{transform:translate(-50%,90%) rotate(-20deg)}45%{transform:translate(-50%,-8%) rotate(8deg)}70%{transform:translate(-50%,4%) rotate(-3deg)}100%{transform:translate(-50%,100%) rotate(-20deg)}}
#game.shake{animation:shake .32s linear}#game.recoil #scene{filter:brightness(.8) saturate(.72)}
@keyframes shake{0%,100%{transform:translate(0)}15%{transform:translate(-5px,2px)}32%{transform:translate(6px,-3px)}50%{transform:translate(-4px,2px)}70%{transform:translate(3px,-1px)}}
@media(min-aspect-ratio:7/10){#scene{transform:scale(1.03)}}
</style></head><body><main id="game">

<!-- fist/forearm animation, stylized and non-graphic -->
<svg id="impact" viewBox="0 0 220 300"><defs><linearGradient id="arm" x2="0" y2="1"><stop stop-color="#d4a184"/><stop offset="1" stop-color="#8e5f50"/></linearGradient></defs><path d="M65 300Q72 210 92 135L78 105Q68 82 89 68Q105 58 118 77L131 56Q150 43 161 65L172 51Q192 49 194 73L200 100Q204 124 182 149L153 190L145 300Z" fill="url(#arm)" stroke="#754e43" stroke-width="5"/><path d="M86 104Q105 115 127 105M126 83Q143 100 164 91M160 74Q177 89 194 82" stroke="#f1c1a2" stroke-width="4" opacity=".45" fill="none"/></svg>
<div id="counter">HARAKATLAR<b id="count">0</b></div><header id="top"><small>TERGOV BO‘LIMI · 04-XONA</small><strong>SO‘ROQ</strong></header>
<div id="left" class="panel"><div class="cap">HARAKAT</div><button class="warn" onclick="act('slap')">SHAPALOQ<span class="sub">sahna animatsiyasi</span></button><button class="warn" onclick="act('punch')">MUSHT<span class="sub">sekin kadrlar</span></button></div>
<div id="right" class="panel"><div class="cap">BOSHQA</div><button class="gold" onclick="question()">SAVOL BERISH<span class="sub">so‘roqni davom et</span></button><button onclick="toggleSound()" id="soundBtn">OVOZ: YOQIQ<span class="sub">ovozni boshqarish</span></button><button id="reset" onclick="resetGame()">↻ QAYTA BOSHLASH</button></div>
<div id="hint">Harakatni tanlang · ovoz uchun ekranga teging</div>
<section id="bottom"><div id="speaker">GUMONLanuvchi</div><div id="dialogue">«Men hammasini aytdim. Yana nimani bilmoqchisiz?»</div></section>
<div id="vignette"></div><div id="flash"></div></main>
<script>
let hits=0, q=0, busy=false, sound=true, audioCtx=null;
const game=document.getElementById('game'),countEl=document.getElementById('count'),dialog=document.getElementById('dialogue'),speaker=document.getElementById('speaker'),woman=document.getElementById('woman');
const speech={
 slap:['«Bas qiling! Men bunday muomalaga loyiq emasman!»','«Iltimos, gapirishimga imkon bering.»','«Men sizdan hech narsani yashirmayapman.»'],
 punch:['«Og‘riyapti… iltimos, to‘xtang.»','«Bilganlarimni aytaman, faqat bas qiling.»','«Bu yo‘l bilan haqiqatni topolmaysiz.»']
};
const questions=['«O‘sha kuni kechqurun uyda edim. Kameralarni tekshiring.»','«U paketni kim qoldirganini bilmayman.»','«Mayli… ko‘rganlarimni aytib beraman.»','«Menga advokat kerak.»'];
function audio(type){
 if(!sound)return;
 try{
  audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==='suspended')audioCtx.resume();
  const now=audioCtx.currentTime, osc=audioCtx.createOscillator(), gain=audioCtx.createGain();
  osc.type=type==='voice'?'sine':'triangle';osc.frequency.setValueAtTime(type==='hit'?115:type==='slap'?190:330,now);osc.frequency.exponentialRampToValueAtTime(type==='hit'?48:type==='slap'?80:210,now+.16);
  gain.gain.setValueAtTime(type==='voice'?.025:.16,now);gain.gain.exponentialRampToValueAtTime(.001,now+.22);osc.connect(gain);gain.connect(audioCtx.destination);osc.start(now);osc.stop(now+.23);
 }catch(e){}
}
function say(text){
 if(!sound||!('speechSynthesis' in window))return;
 try{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(text);u.lang='uz-UZ';u.rate=.91;u.pitch=.96;u.volume=.9;speechSynthesis.speak(u);}catch(e){}
}
function act(type){
 if(busy)return;busy=true;hits++;countEl.textContent=hits;
 const marks=[...document.querySelectorAll('#marks .mark')],idx=Math.min(hits-1,marks.length-1);
 marks.forEach((m,i)=>{if(i<=idx){m.style.opacity=String(.16+Math.min(i*.1,.28));}});
 document.getElementById('marks').setAttribute('opacity','1');
 game.classList.add('shake','hit','recoil');
 const flash=document.getElementById('flash');flash.animate([{opacity:.2},{opacity:0}],{duration:260});
 woman.animate(type==='punch'?[{transform:'translateY(0) rotate(0)'},{transform:'translate(-8px,4px) rotate(-2deg)'},{transform:'translate(5px,0) rotate(1deg)'},{transform:'none'}]:[{transform:'none'},{transform:'translate(10px,2px) rotate(1deg)'},{transform:'translate(-3px,0)'},{transform:'none'}],{duration:580,easing:'ease-out'});
 document.getElementById('mouth').setAttribute('d','M190 297Q210 278 230 297Q210 319 190 297Z');
 speaker.textContent=type==='slap'?'SHAPALOQ':'MUSHT BILAN ZARB';
 const line=speech[type][Math.min(Math.floor((hits-1)/2),2)];dialog.textContent=line;audio(type==='punch'?'hit':'slap');say(line);
 document.getElementById('hint').textContent='Sahna ijro etilmoqda…';
 setTimeout(()=>{game.classList.remove('shake','hit','recoil');document.getElementById('mouth').setAttribute('d','M190 297Q210 287 230 297Q210 311 190 297Z');document.getElementById('hint').textContent='Harakatni tanlang';busy=false;},720);
 if(hits>=7){setTimeout(()=>{speaker.textContent='TIZIM';dialog.textContent='So‘roq to‘xtatildi. Gumonlanuvchiga tibbiy yordam kerak.';},740);}
}
function question(){if(busy)return;let line=questions[q++%questions.length];speaker.textContent='SO‘ROQ';dialog.textContent=line;audio('voice');say(line);}
function toggleSound(){sound=!sound;document.getElementById('soundBtn').innerHTML='OVOZ: '+(sound?'YOQIQ':'O‘CHIQ')+'<span class="sub">ovozni boshqarish</span>';if(!sound&&'speechSynthesis'in window)speechSynthesis.cancel();}
function resetGame(){hits=0;q=0;countEl.textContent='0';document.querySelectorAll('#marks .mark').forEach(m=>m.style.opacity='0');document.getElementById('marks').setAttribute('opacity','0');woman.getAnimations().forEach(a=>a.cancel());woman.style.transform='';document.getElementById('mouth').setAttribute('d','M190 297Q210 287 230 297Q210 311 190 297Z');speaker.textContent='GUMONLАNUVCHI';dialog.textContent='«Men hammasini aytdim. Yana nimani bilmoqchisiz?»';document.getElementById('hint').textContent='Harakatni tanlang';}
</script></body></html>
